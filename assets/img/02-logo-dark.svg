<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <style>
      .brand-title-dark { font-family: 'Playfair Display', 'Cormorant Garamond', serif; font-size: 54px; font-weight: 500; fill: #FDFCF8; }
      .brand-name-dark { font-family: 'Cormorant Garamond', 'Alex Brush', serif; font-style: italic; font-weight: 600; fill: #E6D5B8; }
      .brand-sub-dark { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 20px; font-weight: 400; letter-spacing: 0.18em; fill: #7CA1B4; text-transform: uppercase; }
    </style>
  </defs>
  
  <!-- Navy Background for preview -->
  <rect width="800" height="240" rx="12" fill="#1A365D" />

  <!-- Symbol scaled to fit left side with light lines -->
  <g transform="translate(10, 15) scale(0.52)">
    
  <g transform="translate(0, 0)">
    <!-- Outer circle in bright crisp tone -->
    <ellipse cx="200" cy="200" rx="150" ry="155" fill="none" stroke="#FDFCF8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    
    <!-- Left petal in light blue serene -->
    <path d="M 145,215 C 130,175 140,130 175,105 C 190,135 195,175 175,210 C 165,225 150,225 145,215 Z" fill="#9CC1D2" opacity="0.9" />

    <!-- Right petal in soft pink -->
    <path d="M 205,210 C 220,165 245,130 280,140 C 275,175 255,215 220,230 C 210,225 205,215 205,210 Z" fill="#D8B5B5" opacity="0.9" />

    <!-- Lower leaf in warm sand light -->
    <path d="M 185,245 C 175,275 205,305 230,295 C 240,270 225,245 195,240 Z" fill="#F0E4CE" opacity="0.9" />

    <!-- Central White Stem -->
    <path d="M 182,75 C 190,110 188,145 178,180 C 168,215 172,250 184,285 C 187,298 185,315 180,330" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="180" cy="74" r="5" fill="#FFFFFF" />
  </g>

  </g>

  <!-- Typography Block -->
  <g transform="translate(250, 105)">
    <text class="brand-title-dark">
      Psicóloga <tspan class="brand-name-dark">Rebeka Sales</tspan>
    </text>
    <text y="48" class="brand-sub-dark">
      Psicoterapia e Autoconhecimento
    </text>
  </g>
</svg>